<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Buku Kenangan Digital KP JDN 2026{% endblock %}</title>
  
  <!-- Font Tipografi Premium (Playfair Display & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ========================================================
       DESIGN TOKENS: TEMA MELAYU KLASIK MODEN (A4 CANVA-READY)
       ======================================================== */
    :root {
      --bg-ivory: #FDFBF7;
      --bg-cream: #FAF6EE;
      --bg-card: #FFFFFF;
      --text-main: #1E1B4B;
      --text-muted: #57534E;
      --text-sub: #78716C;
      --gold-primary: #C5A059;
      --gold-deep: #9A7B38;
      --gold-soft: #EADCC3;
      --border-classic: #E8DCC4;
      --border-subtle: #F0E6D2;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      margin: 0;
      padding: 0;
      background: #475569;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Bar Tindakan Terapung (Hanya dipaparkan semasa pratonton skrin web) */
    .screen-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      font-size: 0.88rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-action {
      background: var(--gold-primary);
      color: #1e1b4b;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: #dfb96c;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: #ffffff;
      border: 1px solid #64748b;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.1);
      border-color: #cbd5e1;
    }

    /* Bekas Paparan Halaman A4 */
    .sheets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 48px;
      gap: 28px;
    }

    /* Dimensi Lembaran A4 Portrait Sebenar: 210mm × 297mm */
    .a4-sheet {
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      max-height: 297mm;
      background: var(--bg-ivory);
      position: relative;
      padding: 16mm 18mm 14mm 18mm;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }

    /* Bingkai Hiasan Halus Songket Emas */
    .sheet-inner-border {
      position: absolute;
      top: 8mm;
      bottom: 8mm;
      left: 9mm;
      right: 9mm;
      border: 1px solid var(--border-classic);
      pointer-events: none;
    }

    .sheet-corner-motif {
      position: absolute;
      font-size: 11pt;
      color: var(--gold-primary);
      line-height: 1;
      user-select: none;
    }
    .sheet-corner-motif.tl { top: 6.5mm; left: 7.5mm; }
    .sheet-corner-motif.tr { top: 6.5mm; right: 7.5mm; }
    .sheet-corner-motif.bl { bottom: 6.5mm; left: 7.5mm; }
    .sheet-corner-motif.br { bottom: 6.5mm; right: 7.5mm; }

    /* Header Halaman Bab */
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 3.5mm;
      border-bottom: 1.5px solid var(--gold-soft);
      margin-bottom: 5mm;
      position: relative;
      z-index: 2;
    }

    .sheet-chapter-title {
      font-family: 'Playfair Display', serif;
      font-size: 13pt;
      font-weight: 700;
      color: var(--gold-deep);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .sheet-header-sub {
      font-size: 8pt;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* Kandungan Utama Halaman */
    .sheet-content {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    /* Footer Halaman */
    .sheet-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 3mm;
      border-top: 1px solid var(--border-subtle);
      font-size: 7.5pt;
      color: var(--text-sub);
      margin-top: auto;
      position: relative;
      z-index: 2;
    }

    .sheet-footer-brand {
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .sheet-footer-page {
      font-weight: 700;
      color: var(--gold-deep);
      background: var(--bg-cream);
      padding: 1.5px 7px;
      border-radius: 4px;
      border: 0.5px solid var(--border-classic);
    }

    /* ========================================================
       PERATURAN CETAKAN (PRINT / HEADLESS PDF ENGINE)
       ======================================================== */
    @page {
      size: 210mm 297mm;
      margin: 0;
    }

    @media print {
      body {
        background: #ffffff !important;
      }
      .screen-toolbar {
        display: none !important;
      }
      .sheets-container {
        padding: 0 !important;
        gap: 0 !important;
      }
      .a4-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        page-break-after: always !important;
        break-after: page !important;
        width: 210mm !important;
        height: 297mm !important;
      }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Toolbar Skrin (Hanya semasa semakan browser pentadbir) -->
  <div class="screen-toolbar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="{{ url_for('admin.penjana_buku_dashboard') }}" class="btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Studio
      </a>
      <span style="font-weight: 700; color: #cbd5e1;">
        {% block toolbar_title %}Pratonton Halaman A4{% endblock %}
      </span>
      {% if data_source == 'test' %}
        <span style="background: #f59e0b; color: #78350f; font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; font-weight: 800;">
          MOD DATA UJIAN (DUMMY)
        </span>
      {% else %}
        <span style="background: #10b981; color: #064e3b; font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; font-weight: 800;">
          DATA RASMI
        </span>
      {% endif %}
    </div>

    <div class="toolbar-actions">
      <button type="button" class="btn-outline" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Cetak / Simpan PDF
      </button>
      {% block export_pdf_btn %}{% endblock %}
    </div>
  </div>

  <!-- Bekas Lembaran Halaman A4 -->
  <div class="sheets-container">
    {% block sheets_content %}{% endblock %}
  </div>

</body>
</html>
