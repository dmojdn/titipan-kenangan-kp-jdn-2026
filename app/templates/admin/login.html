{% extends "base.html" %}

{% block title %}Log Masuk Pentadbir | Titipan Kenangan Buat KP{% endblock %}

{% block content %}
<div class="container" style="max-width: 440px; margin: 4.5rem auto;">
  <div class="white-card" style="box-shadow: var(--shadow-lg); padding: 2.5rem 2rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; margin: 0 auto 1rem; border-radius: 50%; background: #ede9fe; color: #7c3aed; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.15);">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="font-size: 1.45rem; color: #1e1b4b; font-weight: 800;">Akses Pentadbir</h2>
      <p style="font-size: 0.85rem; color: #64748b;">Pengurusan kiriman ucapan dan storan Google Drive</p>
    </div>

    <form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
      <div class="form-group-custom" style="margin-bottom: 1.5rem;">
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" name="password" class="form-control-custom" placeholder="Kata laluan pentadbir" required autofocus>
        </div>
      </div>

      <button type="submit" class="btn btn-submit-sparkle" style="width: 100%;">
        <i class="fa-solid fa-right-to-bracket"></i> Log Masuk Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid #f1f5f9; padding-top: 1rem;">
      <a href="{{ url_for('public.index') }}" style="color: #64748b; font-size: 0.82rem; text-decoration: none; font-weight: 600;">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Portal Warga
      </a>
    </div>

  </div>
</div>
{% endblock %}
